<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cascading Causal Cockpit · Scaffold Template</title>
<!--
  ===== Cascading Causal Cockpit Scaffold Template =====

  使用方法:
  1. 复制本文件,改成你的系统名(如 my-business-causal-map.html)
  2. 替换 ARCH_MAP 字典中的 archetype 定义
  3. 替换 SVG 节点 (rect/text) 的文字标签和颜色
  4. 替换 SVG 连接线 (path) 的 d 属性 和 data-arch / data-dom
  5. 替换矩阵和配方卡的内容

  保留:
  - 4 列布局结构 (数据源/中间层/分组/输出)
  - 4 态颜色编码 (绿/黄/红/蓝)
  - JS 交互逻辑 (基本无需改动)
  - CSS 状态类 (svg-dimmed / svg-active-ring / prod-active)

  N=1 范本: 卓里奇因子库与策略诊断 v3.2
-->
<style>
:root{
  --bg:#0a0a0c; --bg2:#0e0e12; --surf:#16161b; --surf2:#1c1c23; --surf3:#23232b;
  --line:#2a2a33; --line2:#363641;
  --gold:#c8a05a; --gold-d:#9c7d44; --gold-s:#d8bd86;
  --txt:#ececed; --txt2:#a6a6b0; --txt3:#75757f;
  --red:#e5484d; --red-bg:#2a1416;
  --green:#3dd68c; --green-bg:#0f2a1d;
  --amber:#f5b53a; --amber-bg:#2a2010;
  --blue:#6aa6e8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;line-height:1.6;font-size:14.5px;padding:30px 20px}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:24px;color:var(--gold-s);margin-bottom:8px}
.sub{color:var(--txt2);font-size:13px;margin-bottom:20px}

/* === 交互核心 CSS === */
rect.arch-rect{cursor:pointer;transition:opacity .25s, filter .15s}
rect.arch-rect:hover{filter:brightness(1.35) drop-shadow(0 0 4px rgba(200,160,90,.5))}
rect.dat-rect,rect.dom-rect,rect.prod-rect{transition:opacity .25s}
path.conn,path.conn-dp{transition:opacity .25s}
.svg-dimmed{opacity:.10!important}
.svg-active-ring{filter:drop-shadow(0 0 6px rgba(200,160,90,.9))}

/* 输出节点金色脉冲(被选中 archetype 的下游产品) */
rect.prod-active{
  stroke:#c8a05a!important;
  stroke-width:2.5!important;
  animation:prod-pulse 1.6s ease-in-out infinite
}
@keyframes prod-pulse{
  0%,100%{filter:drop-shadow(0 0 4px rgba(200,160,90,.5))}
  50%{filter:drop-shadow(0 0 10px rgba(216,189,134,1)) drop-shadow(0 0 3px rgba(200,160,90,.8))}
}

.svg-hint{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(200,160,90,.08),transparent);border-left:3px solid var(--gold);padding:9px 14px;border-radius:0 8px 8px 0;margin:6px 0 10px;font-size:13px;color:var(--gold-s)}
.svg-hint b{color:var(--gold)}
.svg-info-panel{margin-top:8px;background:var(--surf);border:1px solid var(--line2);border-radius:8px;padding:10px 14px;font-size:12.5px;color:var(--txt2);min-height:30px;display:none}
.svg-info-panel.show{display:block}
.svg-info-panel .lab{color:var(--gold);font-weight:700;margin-right:8px}

.svg-container{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0;overflow-x:auto}
</style></head><body>

<div class="wrap">
  <h1>Cascading Causal Cockpit · 通用模板</h1>
  <div class="sub">替换 ARCH_MAP 字典 + SVG 节点文字 + 矩阵/配方卡内容即可适配你的系统。N=1 范本: 卓里奇 4 层级联。</div>

  <div id="causal-map">
    <div class="svg-hint">💡 <span>点击中间的 <b>archetype</b> 节点可高亮其完整传导路径——左侧 <b>数据源</b>、中间 <b>域</b>、右侧 <b>具体输出（金色脉冲光环）</b>。</span></div>

    <div class="svg-container">
    <!-- ============ 这是一个最小可运行 demo: 3 archetype × 2 domain × 3 output ============ -->
    <svg viewBox="0 0 1180 480" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;min-width:1000px;display:block">
      <text x="100"  y="22" fill="#c8a05a" font-size="13" font-weight="700" text-anchor="middle">数据源</text>
      <text x="400"  y="22" fill="#c8a05a" font-size="13" font-weight="700" text-anchor="middle">archetype</text>
      <text x="760"  y="22" fill="#c8a05a" font-size="13" font-weight="700" text-anchor="middle">分组</text>
      <text x="1060" y="22" fill="#c8a05a" font-size="13" font-weight="700" text-anchor="middle">输出</text>

      <!-- Layer 1: 数据源 (2个示例) -->
      <rect class="dat-rect" data-src="数据A" x="20" y="80" width="160" height="40" rx="6" fill="#1c1c23" stroke="#c8a05a" stroke-width="1.2"/>
      <text x="100" y="96" fill="#ececed" font-size="11" text-anchor="middle">数据源 A</text>
      <text x="100" y="110" fill="#a6a6b0" font-size="10" text-anchor="middle">原料 70%</text>

      <rect class="dat-rect" data-src="数据B" x="20" y="160" width="160" height="40" rx="6" fill="#1c1c23" stroke="#c8a05a" stroke-width="0.8"/>
      <text x="100" y="176" fill="#ececed" font-size="11" text-anchor="middle">数据源 B</text>
      <text x="100" y="190" fill="#a6a6b0" font-size="10" text-anchor="middle">原料 30%</text>

      <!-- Layer 2: archetype (3个示例) -->
      <rect class="arch-rect" data-arch="1" x="290" y="80" width="220" height="38" rx="6" fill="#0f2a1d" stroke="#3dd68c" stroke-width="1.4"/>
      <text x="400" y="96" fill="#ececed" font-size="11" text-anchor="middle">① archetype 健康</text>
      <text x="400" y="110" fill="#7fe0ad" font-size="10" text-anchor="middle">现役主力</text>

      <rect class="arch-rect" data-arch="2" x="290" y="155" width="220" height="38" rx="6" fill="#2a2010" stroke="#f5b53a" stroke-width="1"/>
      <text x="400" y="171" fill="#ececed" font-size="11" text-anchor="middle">② archetype 震荡</text>
      <text x="400" y="185" fill="#ffd28a" font-size="10" text-anchor="middle">攻坚中</text>

      <rect class="arch-rect" data-arch="3" x="290" y="230" width="220" height="38" rx="6" fill="#2a1416" stroke="#e5484d" stroke-width="1.4"/>
      <text x="400" y="246" fill="#ececed" font-size="11" text-anchor="middle">③ archetype 待加固</text>
      <text x="400" y="260" fill="#ff8a8e" font-size="10" text-anchor="middle">⚠ 同质化</text>

      <!-- Layer 3: 分组 (2个示例) -->
      <rect class="dom-rect" data-dom="L" x="690" y="100" width="140" height="50" rx="8" fill="#0f2a1d" stroke="#3dd68c" stroke-width="1.4"/>
      <text x="760" y="120" fill="#ececed" font-size="12" font-weight="700" text-anchor="middle">分组 A</text>
      <text x="760" y="136" fill="#a6a6b0" font-size="10" text-anchor="middle">健康</text>

      <rect class="dom-rect" data-dom="S" x="690" y="210" width="140" height="50" rx="8" fill="#2a1416" stroke="#e5484d" stroke-width="1.4"/>
      <text x="760" y="230" fill="#ececed" font-size="12" font-weight="700" text-anchor="middle">分组 B</text>
      <text x="760" y="246" fill="#ff8a8e" font-size="10" text-anchor="middle">待加固</text>

      <!-- Layer 4: 输出 (3个示例) -->
      <rect class="prod-rect" data-doms="L" data-prod="输出 X" x="970" y="80" width="180" height="42" rx="6" fill="#0f2a1d" stroke="#3dd68c" stroke-width="1.4"/>
      <text x="1060" y="98" fill="#ececed" font-size="11" font-weight="700" text-anchor="middle">输出 X</text>
      <text x="1060" y="114" fill="#7fe0ad" font-size="10" text-anchor="middle">健康</text>

      <rect class="prod-rect" data-doms="S" data-prod="输出 Y" x="970" y="160" width="180" height="42" rx="6" fill="#2a1416" stroke="#e5484d" stroke-width="1.2"/>
      <text x="1060" y="178" fill="#ececed" font-size="11" font-weight="700" text-anchor="middle">输出 Y</text>
      <text x="1060" y="194" fill="#ff8a8e" font-size="10" text-anchor="middle">待加固</text>

      <rect class="prod-rect" data-doms="L,S" data-prod="输出 Z" x="970" y="240" width="180" height="42" rx="6" fill="#1c1c23" stroke="#c8a05a" stroke-width="0.8"/>
      <text x="1060" y="258" fill="#ececed" font-size="11" font-weight="700" text-anchor="middle">输出 Z（复合）</text>
      <text x="1060" y="274" fill="#a6a6b0" font-size="10" text-anchor="middle">混合</text>

      <!-- 连接线 Layer 1 → 2 -->
      <g stroke="#c8a05a" fill="none" opacity="0.5">
        <path class="conn" data-arch="1" d="M 180 100 C 235 100, 235 99, 290 99" stroke-width="2.4"/>
        <path class="conn" data-arch="2" d="M 180 100 C 235 130, 235 174, 290 174" stroke-width="1.5"/>
        <path class="conn" data-arch="3" d="M 180 100 C 235 170, 235 249, 290 249" stroke-width="1.2"/>
        <path class="conn" data-arch="2" d="M 180 180 C 235 180, 235 174, 290 174" stroke-width="1.8"/>
        <path class="conn" data-arch="3" d="M 180 180 C 235 210, 235 249, 290 249" stroke-width="2.0"/>
      </g>

      <!-- 连接线 Layer 2 → 3 -->
      <g stroke="#c8a05a" fill="none" opacity="0.55">
        <path class="conn" data-arch="1" d="M 510 99 C 600 99, 600 125, 690 125" stroke-width="2.4" stroke="#3dd68c"/>
        <path class="conn" data-arch="2" d="M 510 174 C 600 174, 600 125, 690 125" stroke-width="1.5"/>
        <path class="conn" data-arch="2" d="M 510 174 C 600 200, 600 235, 690 235" stroke-width="1.5"/>
        <path class="conn" data-arch="3" d="M 510 249 C 600 249, 600 235, 690 235" stroke-width="2.6" stroke="#e5484d"/>
      </g>

      <!-- 连接线 Layer 3 → 4 -->
      <g stroke="#c8a05a" fill="none" opacity="0.55">
        <path class="conn-dp" data-dom="L" d="M 830 125 C 900 125, 900 101, 970 101" stroke-width="2.6" stroke="#3dd68c"/>
        <path class="conn-dp" data-dom="L" d="M 830 125 C 900 180, 900 261, 970 261" stroke-width="1.3"/>
        <path class="conn-dp" data-dom="S" d="M 830 235 C 900 200, 900 181, 970 181" stroke-width="2.8" stroke="#e5484d"/>
        <path class="conn-dp" data-dom="S" d="M 830 235 C 900 250, 900 261, 970 261" stroke-width="1.4"/>
      </g>

      <!-- 图例 -->
      <g font-size="10" fill="#a6a6b0">
        <rect x="20"  y="430" width="14" height="10" fill="#0f2a1d" stroke="#3dd68c" stroke-width="1"/>
        <text x="40"  y="439">健康</text>
        <rect x="100" y="430" width="14" height="10" fill="#2a2010" stroke="#f5b53a" stroke-width="1"/>
        <text x="120" y="439">震荡</text>
        <rect x="180" y="430" width="14" height="10" fill="#2a1416" stroke="#e5484d" stroke-width="1"/>
        <text x="200" y="439">待加固</text>
        <line x1="280" y1="436" x2="310" y2="436" stroke="#c8a05a" stroke-width="2.4" opacity="0.75"/>
        <text x="318" y="439">主导路径</text>
        <line x1="400" y1="436" x2="430" y2="436" stroke="#c8a05a" stroke-width="1" opacity="0.5"/>
        <text x="438" y="439">次要路径</text>
      </g>
    </svg>
    </div>

    <div class="svg-info-panel" id="causal-info">
      <span class="lab">已选 archetype:</span><span id="causal-info-text">—</span>
    </div>
  </div>
</div>

<script>
// ===== 核心: ARCH_MAP 字典 + 点击交互 =====
(function(){
  // 替换为你的系统的 archetype 映射
  var ARCH_MAP={
    1:{name:"① archetype 健康",sources:["数据A"],doms:["L"],note:"现役主力,持续贡献。"},
    2:{name:"② archetype 震荡",sources:["数据A","数据B"],doms:["L","S"],note:"在攻坚中,效果未稳定。"},
    3:{name:"③ archetype 待加固",sources:["数据A","数据B"],doms:["S"],note:"⚠ 当前同质化,需工程加固。"}
  };
  var DOM_NAMES={"L":"分组 A","S":"分组 B"};

  var svg=document.querySelector("#causal-map svg"); if(!svg) return;
  var info=document.getElementById("causal-info");
  var infoText=document.getElementById("causal-info-text");
  var allDimable=svg.querySelectorAll("rect.arch-rect,rect.dat-rect,rect.dom-rect,rect.prod-rect,path.conn,path.conn-dp");
  var activeArch=null;

  function reset(){
    activeArch=null;
    allDimable.forEach(function(el){el.classList.remove("svg-dimmed","svg-active-ring","prod-active")});
    info.classList.remove("show");
  }

  function activate(archId){
    var m=ARCH_MAP[archId]; if(!m) return;
    allDimable.forEach(function(el){el.classList.add("svg-dimmed")});
    svg.querySelectorAll('rect.arch-rect[data-arch="'+archId+'"]').forEach(function(el){
      el.classList.remove("svg-dimmed"); el.classList.add("svg-active-ring");
    });
    m.sources.forEach(function(s){
      svg.querySelectorAll('rect.dat-rect[data-src="'+s+'"]').forEach(function(el){el.classList.remove("svg-dimmed")});
    });
    m.doms.forEach(function(d){
      svg.querySelectorAll('rect.dom-rect[data-dom="'+d+'"]').forEach(function(el){el.classList.remove("svg-dimmed")});
      svg.querySelectorAll('path.conn-dp[data-dom="'+d+'"]').forEach(function(el){el.classList.remove("svg-dimmed")});
    });
    // 精确高亮下游输出
    var activeDomSet=new Set(m.doms);
    svg.querySelectorAll("rect.prod-rect").forEach(function(el){
      var pdoms=(el.dataset.doms||"").split(",");
      var matched=pdoms.some(function(d){return activeDomSet.has(d)});
      if(matched){
        el.classList.remove("svg-dimmed");
        el.classList.add("svg-active-ring","prod-active");
      }
    });
    svg.querySelectorAll('path.conn[data-arch="'+archId+'"]').forEach(function(el){el.classList.remove("svg-dimmed")});

    info.classList.add("show");
    var domsName=m.doms.map(function(d){return DOM_NAMES[d]}).join(" / ");
    var prodList=[];
    svg.querySelectorAll('rect.prod-rect.prod-active').forEach(function(el){prodList.push(el.dataset.prod)});
    var prodsStr=prodList.length?prodList.join(' / '):'—';
    infoText.innerHTML='<b style="color:var(--gold-s)">'+m.name+'</b>'+
      ' · 数据源 ['+m.sources.join(" · ")+']'+
      ' → 分组 ['+domsName+']'+
      ' → <b style="color:#d8bd86">输出 ['+prodsStr+']</b>'+
      '<br><span style="color:var(--txt3);font-size:12px">'+m.note+'</span>';
  }

  svg.querySelectorAll("rect.arch-rect").forEach(function(r){
    r.addEventListener("click",function(e){
      e.stopPropagation();
      var id=r.dataset.arch;
      if(activeArch===id){reset();return;}
      reset(); activeArch=id; activate(id);
    });
  });
  document.addEventListener("click",function(e){
    if(activeArch && !e.target.closest("rect.arch-rect")){reset();}
  });
})();
</script>
</body></html>
